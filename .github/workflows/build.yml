name: Build Camera Security APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          unzip -o CameraSecurity_Flutter_Project.zip -d .
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create . \
            --platforms=android \
            --org com.hussainalbeyati \
            --project-name camera_security

      - name: Set Android minimum SDK to 28
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              s, count = re.subn(
                  r'minSdk\s*=\s*flutter\.minSdkVersion',
                  'minSdk = 28',
                  s
              )
          else:
              p = Path("android/app/build.gradle")
              if not p.exists():
                  raise SystemExit("Android Gradle file not found")
              s = p.read_text()
              s, count = re.subn(
                  r'minSdkVersion\s+flutter\.minSdkVersion',
                  'minSdkVersion 28',
                  s
              )

          if count == 0:
              raise SystemExit("Could not find minSdk setting")
          
          p.write_text(s)
          print("Minimum Android SDK set to 28")

          PY

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>',
          ]

          for permission in permissions:
              if permission not in s:
                  s = s.replace(
                      '<application',
                      permission + '\n    <application',
                      1
                  )

          s = s.replace(
              'android:label="camera_security"',
              'android:label="Camera Security"'
          )

          p.write_text(s)
          PY

      - name: Prepare alarm sound
        run: |
          mkdir -p assets
          test -f assets/alarm.wav || cp alarm.wav assets/alarm.wav
          test -f assets/alarm.wav

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Remove default tests
        run: rm -rf test

      - name: Analyze Flutter project
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Security-Cyber-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
