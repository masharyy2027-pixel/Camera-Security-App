
name: Build Camera Security APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          unzip -o CameraSecurity_Flutter_Project.zip -d .
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux libraries for MediaPipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2

      - name: Generate Android platform files
        run: |
          flutter create . \
            --platforms=android \
            --org com.hussainalbeyati \
            --project-name camera_security

      - name: Set Android minimum SDK to 28
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          gradle = next((p for p in candidates if p.exists()), None)

          if gradle is None:
              raise SystemExit("Android Gradle file not found")

          content = gradle.read_text()

          if gradle.name.endswith(".kts"):
              content, count = re.subn(
                  r'minSdk\s*=\s*flutter\.minSdkVersion',
                  'minSdk = 28',
                  content,
                  count=1
              )

              if count == 0:
                  content, count = re.subn(
                      r'minSdk\s*=\s*\d+',
                      'minSdk = 28',
                      content,
                      count=1
                  )
          else:
              content, count = re.subn(
                  r'minSdkVersion\s+flutter\.minSdkVersion',
                  'minSdkVersion 28',
                  content,
                  count=1
              )

              if count == 0:
                  content, count = re.subn(
                      r'minSdkVersion\s+\d+',
                      'minSdkVersion 28',
                      content,
                      count=1
                  )

          if count == 0:
              raise SystemExit("Could not set Android minSdk")

          gradle.write_text(content)
          print("Android minimum SDK set to 28")
          PYCODE

      - name: Configure Android camera permission
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.CAMERA"/>'
          )

          if permission not in content:
              content = content.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )

          content = content.replace(
              'android:label="camera_security"',
              'android:label="Camera Security"'
          )

          manifest.write_text(content)
          PYCODE

      - name: Prepare alarm sound
        run: |
          mkdir -p assets

          if [ -f alarm.wav ]; then
            cp alarm.wav assets/alarm.wav
          fi

          test -s assets/alarm.wav

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Bundle and verify MediaPipe face model
        run: |
          dart run mediapipe_core:bundle_models || {
            echo "Bundle command returned an error."
            echo "Checking whether the model was created..."
          }

          test -s assets/mediapipe/blaze_face_short_range.tflite

          echo "MediaPipe model exists:"
          ls -lh assets/mediapipe/blaze_face_short_range.tflite

      - name: Generate app launcher icon
        run: dart run flutter_launcher_icons

      - name: Remove default tests
        run: rm -rf test

      - name: Analyze Flutter code
        run: |
          flutter analyze lib \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify model inside APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -s "$APK"

          unzip -l "$APK" | grep -i \
            'blaze_face_short_range.tflite'

          echo "MediaPipe model verified inside APK!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Security-MediaPipe-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
