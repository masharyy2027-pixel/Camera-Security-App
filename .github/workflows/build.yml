name: Camera Security - MediaPipe Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter project
        shell: bash
        run: |
          set -e

          if [ -f "CameraSecurity_Flutter_Project.zip" ]; then
            mkdir -p project
            unzip -oq CameraSecurity_Flutter_Project.zip -d project
          fi

          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            PROJECT_DIR="$(find "$GITHUB_WORKSPACE/project" -name pubspec.yaml -not -path '*/.dart_tool/*' -printf '%h\n' | head -n 1)"
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "ERROR: Flutter project was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 unzip

      - name: Generate Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter create . \
            --platforms=android \
            --org com.hussainalbeyati \
            --project-name camera_security

      - name: Configure Android SDK and permissions
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]:
              if not path.exists():
                  continue

              text = path.read_text()

              if path.name.endswith(".kts"):
                  text = re.sub(
                      r"minSdk\s*=\s*[^\n]+",
                      "minSdk = 28",
                      text
                  )
              else:
                  text = re.sub(
                      r"minSdkVersion\s+[^ \n]+",
                      "minSdkVersion 28",
                      text
                  )
                  text = re.sub(
                      r"minSdk\s*=\s*[^\n]+",
                      "minSdk = 28",
                      text
                  )

              path.write_text(text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          text = manifest.read_text()

          for permission in [
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO"
          ]:
              tag = f'<uses-permission android:name="{permission}" />'
              if permission not in text:
                  text = text.replace(
                      "<application",
                      tag + "\n    <application",
                      1
                  )

          manifest.write_text(text)
          PY

      - name: Prepare alarm sound
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ -f "alarm.wav" ]; then
            mkdir -p assets
            cp alarm.wav assets/alarm.wav
          elif [ -f "assets/alarm.wav" ]; then
            echo "Alarm already exists."
          else
            echo "WARNING: alarm.wav not found."
          fi

      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Bundle MediaPipe model
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          dart run mediapipe_core:bundle_models

          test -s assets/mediapipe/manifest.json

          MODEL_FILE="$(find assets/mediapipe -maxdepth 1 -type f \
            ! -name 'manifest.json' -size +0c | head -n 1)"

          if [ -z "$MODEL_FILE" ]; then
            echo "ERROR: Model not found."
            ls -lah assets/mediapipe/
            exit 1
          fi

          echo "MediaPipe model successfully bundled:"
          ls -lh "$MODEL_FILE"
          cat assets/mediapipe/manifest.json

      - name: Analyze application source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze lib

      - name: Build Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      - name: Verify APK and MediaPipe files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -s "$APK"

          echo "APK created:"
          ls -lh "$APK"

          echo "Checking MediaPipe manifest..."
          unzip -Z1 "$APK" | grep -E 'assets/flutter_assets/assets/mediapipe/manifest.json'

          echo "Checking bundled model..."
          unzip -Z1 "$APK" | grep -E 'assets/flutter_assets/assets/mediapipe/[0-9a-f]{64}$'

          echo "APK verification completed."

      - name: Upload MediaPipe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MediaPipe-hook-diagnostics
          path: |
            ${{ env.PROJECT_DIR }}/.dart_tool/hooks_runner/
            ${{ env.PROJECT_DIR }}/assets/mediapipe/
          if-no-files-found: warn

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Security-MediaPipe-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
